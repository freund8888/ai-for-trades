<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>AI for Trades — Job Estimator</title>
  <meta name="description" content="Fast, transparent job estimates for trades using AI." />

  <!-- Favicon (kept if you have one at this path; safe if not) -->
  <link rel="icon" href="/favicon.ico" />

  <!-- Self-contained styles -->
  <style>
    :root{
      --bg:#0b0d12;
      --card:#11151d;
      --muted:#8ea2b7;
      --text:#e9eef5;
      --line:#1d2330;
      --accent:#4ba3ff;
      --accent-2:#76d5a9;
      --danger:#ff6b6b;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      background:linear-gradient(180deg,#0a0f17 0%, #0c1119 100%);
      color:var(--text);
    }

    header{
      display:flex; align-items:center; gap:.75rem;
      padding:20px 24px; border-bottom:1px solid var(--line);
      background:rgba(17,21,29,.7); backdrop-filter: blur(6px);
      position:sticky; top:0; z-index:10;
    }
    header h1{margin:0; font-size:1.125rem; font-weight:650; letter-spacing:.2px}
    header .badge{margin-left:auto; font-size:.8rem; color:var(--muted)}
    .logo{
      width:28px; height:28px; display:inline-block;
      border-radius:8px; background:radial-gradient(100% 100% at 50% 0%, var(--accent) 0%, #1b73d6 60%, #0d2344 100%);
      position:relative; overflow:hidden;
    }
    .logo svg{position:absolute; inset:0; width:100%; height:100%}

    /* Layout */
    #app{
      display:grid; gap:20px;
      grid-template-columns: 1.1fr 1fr;
      padding:20px 24px;
      max-width:1200px; margin:0 auto;
    }
    @media (max-width: 980px){
      #app{ grid-template-columns: 1fr; }
    }

    /* Panels */
    .pane{
      background:linear-gradient(180deg, #0f1420 0%, #0e1320 100%);
      border:1px solid var(--line);
      border-radius:14px; padding:18px 18px 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.02);
    }
    .pane h2{margin:0 0 12px; font-size:1rem; color:#d9e5f5; font-weight:600}

    /* Form */
    form label{
      display:block; margin:10px 0 6px; font-size:.9rem; color:var(--muted);
    }
    input, textarea, button{
      font:inherit; color:var(--text);
    }
    input, textarea{
      width:100%; border:1px solid #21304a; background:#0b1320;
      border-radius:10px; padding:10px 12px; outline:none;
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder, textarea::placeholder{ color:#5f728a; }
    input:focus, textarea:focus{
      border-color:#2e5fa3; box-shadow:0 0 0 3px rgba(75,163,255,.18);
    }
    textarea{ min-height:140px; resize:vertical; }

    .actions{
      display:flex; gap:10px; margin-top:12px;
      flex-wrap:wrap;
    }
    button{
      border:1px solid #244a7a; background:linear-gradient(180deg,#164a8a,#123b6d);
      padding:10px 14px; border-radius:10px; cursor:pointer;
      transition:filter .15s ease, transform .02s ease;
    }
    button:hover{ filter:brightness(1.08); }
    button:active{ transform:translateY(1px); }
    button[disabled]{ opacity:.55; cursor:not-allowed; }

    .btn-secondary{
      background:linear-gradient(180deg,#222b3b,#1b2432);
      border-color:#2b3546;
    }

    /* Customer Card */
    #customerCard{
      margin-top:14px; border:1px solid #223049; background:#0c1422;
      border-radius:12px; padding:12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
    }
    #customerCard[hidden]{ display:none !important; }
    .cust-row{ margin:6px 0; font-size:.95rem; }
    .cust-row strong{ color:#cfe2f7; margin-right:6px; }

    /* Inline error */
    #inlineError{
      margin-top:12px; border:1px solid rgba(255,107,107,.35);
      background:rgba(255,107,107,.12); color:#ffd3d3;
      border-radius:10px; padding:10px 12px; font-size:.9rem;
    }
    #inlineError[hidden]{ display:none !important; }

    /* Output */
    #estimateOutput{
      min-height:420px;
      background:#0b1320; border:1px solid #21304a; border-radius:12px;
      padding:12px; width:100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:.92rem; color:#d9e7ff;
      white-space:pre; overflow:auto;
    }

    footer{
      max-width:1200px; margin:14px auto 40px; color:var(--muted);
      padding:0 24px; font-size:.85rem;
    }
  </style>
</head>

<body>
  <header>
    <span class="logo" aria-hidden="true">
      <!-- Inline SVG mark -->
      <svg viewBox="0 0 100 100" role="img" aria-label="AI for Trades">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7ed0ff"/>
            <stop offset="1" stop-color="#4ba3ff"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="100" height="100" fill="url(#g1)"/>
        <path d="M18 62 L40 30 L60 55 L80 38 L82 62 L62 72 L42 52 L28 71 Z" fill="rgba(8,15,30,.55)" />
      </svg>
    </span>
    <h1>AI for Trades — Job Estimator</h1>
    <span class="badge">v106.6c</span>
  </header>

  <main id="app">
    <!-- Left pane: inputs -->
    <section id="left-pane" class="pane">
      <h2>Job & Customer</h2>
      <form id="estimateForm" autocomplete="on">
        <!-- Customer fields (IDs must match app.js) -->
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" placeholder="First Name" />

        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" placeholder="Last Name" />

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" placeholder="(555) 555-5555" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" />

        <label for="address">Address</label>
        <input id="address" name="address" type="text" placeholder="123 Main St, City, ST" />

        <label for="jobDescription">Job Description</label>
        <textarea id="jobDescription" name="jobDescription" placeholder="Describe the job..."></textarea>

        <div class="actions">
          <button id="estimateBtn" type="submit">Generate Estimate</button>
          <button type="reset" class="btn-secondary">Reset</button>
        </div>
      </form>

      <!-- Customer summary card (native hidden attribute; no external CSS needed) -->
      <section id="customerCard" hidden aria-live="polite" aria-label="Customer summary">
        <div class="cust-row"><strong>Name:</strong> <span id="custName"></span></div>
        <div class="cust-row"><strong>Phone:</strong> <span id="custPhone"></span></div>
        <div class="cust-row"><strong>Email:</strong> <span id="custEmail"></span></div>
        <div class="cust-row"><strong>Address:</strong> <span id="custAddress"></span></div>
      </section>

      <!-- Inline error -->
      <div id="inlineError" hidden></div>
    </section>

    <!-- Right pane: output -->
    <section id="right-pane" class="pane">
      <h2>Estimate Results</h2>
      <textarea id="estimateOutput" readonly placeholder="Estimate results will appear here..."></textarea>
    </section>
  </main>

  <footer>
    <p>AI for Trades Prototype — v106.6c • Frontend is self-contained for styling. JS: <code>/app.js?v=106.10d</code></p>
  </footer>

  <!-- Your application script (v106.10d as provided earlier) -->
  <script src="/app.js?v=106.10d"></script>
</body>
</html>
