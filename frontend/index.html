<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>AI for Trades — Job Estimator</title>

  <meta name="description" content="Fast, transparent job estimates for trades using AI." />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Keep your existing stylesheet; no new inline CSS added -->
  <link rel="stylesheet" href="/styles.css?v=106.6">
  <!-- Keep/restore your favicon (adjust path if your icon file differs) -->
  <link rel="icon" href="/favicon.ico" />
</head>

<body>
  <header>
    <h1>AI for Trades — Job Estimator</h1>
  </header>

  <main id="app">
    <!-- Left side: form -->
    <section id="left-pane">
      <form id="estimateForm" autocomplete="on">
        <!-- Customer fields (IDs and names aligned with app.js) -->
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" placeholder="First Name" />

        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" placeholder="Last Name" />

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" placeholder="(555) 555-5555" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" />

        <label for="address">Address</label>
        <input id="address" name="address" type="text" placeholder="123 Main St" />

        <!-- Example job field (keep/extend as needed) -->
        <label for="jobDescription">Job Description</label>
        <textarea id="jobDescription" name="jobDescription" placeholder="Describe the job..."></textarea>

        <div class="actions">
          <button id="estimateBtn" type="submit">Generate Estimate</button>
          <button type="reset">Reset</button>
        </div>
      </form>

      <!-- Customer summary card (starts hidden via the HTML 'hidden' attribute, no CSS required) -->
      <section id="customerCard" hidden aria-live="polite" aria-label="Customer summary">
        <div><strong>Name:</strong> <span id="custName"></span></div>
        <div><strong>Phone:</strong> <span id="custPhone"></span></div>
        <div><strong>Email:</strong> <span id="custEmail"></span></div>
        <div><strong>Address:</strong> <span id="custAddress"></span></div>
      </section>

      <!-- Inline error area (also starts hidden) -->
      <div id="inlineError" hidden></div>
    </section>

    <!-- Right side: results / output -->
    <section id="right-pane">
      <h2>Estimate Results</h2>
      <textarea id="estimateOutput" readonly placeholder="Estimate results will appear here..."></textarea>
    </section>
  </main>

  <footer>
    <small>AI for Trades Prototype — v106.6b</small>
  </footer>

  <!-- App script -->
  <script src="/app.js?v=106.10d"></script>
</body>
</html>
