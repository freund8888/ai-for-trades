<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI for Trades — Job Estimator</title>
  <meta name="description" content="Fast, transparent job estimates for trades using AI." />
  <link rel="icon" href="/favicon.ico" />

  <style>
    :root{
      --bg:#0b0d12; --card:#11151d; --muted:#8ea2b7; --text:#e9eef5;
      --line:#1d2330; --accent:#4ba3ff; --ok:#76d5a9; --warn:#ffb86b; --err:#ff6b6b;
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#0a0f17 0%, #0c1119 100%);color:var(--text)}
    header{display:flex;align-items:center;gap:.75rem;padding:16px 20px;border-bottom:1px solid var(--line);background:rgba(17,21,29,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:10}
    header h1{margin:0;font-size:1.08rem;font-weight:650;letter-spacing:.2px}
    .badge{margin-left:auto;font-size:.8rem;color:var(--muted)}
    .dot{width:10px;height:10px;border-radius:50%;background:#4ba3ff;box-shadow:0 0 0 2px rgba(75,163,255,.15);margin-left:8px}
    .dot.ok{background:var(--ok)} .dot.err{background:var(--err)} .dot.warn{background:var(--warn)}

    #app{display:grid;gap:20px;grid-template-columns:1.1fr 1fr;padding:20px;max-width:1200px;margin:0 auto}
    @media (max-width:980px){#app{grid-template-columns:1fr}}

    .pane{background:linear-gradient(180deg,#0f1420 0%, #0e1320 100%);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.02)}
    .pane h2{margin:0 0 12px;font-size:1rem;color:#d9e5f5;font-weight:600}

    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .row + .row, .row-3 + .row, .row + .row-3{margin-top:12px}
    @media (max-width:720px){.row,.row-3{grid-template-columns:1fr}}

    label{display:block;margin:10px 0 6px;font-size:.9rem;color:var(--muted)}
    input, select, textarea, button{font:inherit;color:var(--text)}
    input, select, textarea{width:100%;border:1px solid #21304a;background:#0b1320;border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s, box-shadow .15s}
    input::placeholder, textarea::placeholder{color:#5f728a}
    input:focus, select:focus, textarea:focus{border-color:#2e5fa3;box-shadow:0 0 0 3px rgba(75,163,255,.18)}
    textarea{min-height:120px;resize:vertical}

    .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
    button{border:1px solid #244a7a;background:linear-gradient(180deg,#164a8a,#123b6d);padding:10px 14px;border-radius:10px;cursor:pointer;transition:filter .15s, transform .02s}
    button:hover{filter:brightness(1.08)} button:active{transform:translateY(1px)} button[disabled]{opacity:.55;cursor:not-allowed}
    .btn-secondary{background:linear-gradient(180deg,#222b3b,#1b2432);border-color:#2b3546}

    #customerCard{margin-top:14px;border:1px solid #223049;background:#0c1422;border-radius:12px;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
    #customerCard[hidden]{display:none !important}
    .cust-row{margin:6px 0;font-size:.95rem}
    .cust-row strong{color:#cfe2f7;margin-right:6px}

    #inlineError{margin-top:12px;border:1px solid rgba(255,107,107,.35);background:rgba(255,107,107,.12);color:#ffd3d3;border-radius:10px;padding:10px 12px;font-size:.9rem}
    #inlineError[hidden]{display:none !important}

    #resultHeader{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
    #custNameHeader{font-weight:600;color:#d9e5f5}

    #estimateOutput{min-height:420px;background:#0b1320;border:1px solid #21304a;border-radius:12px;padding:12px;width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92rem;color:#d9e7ff;white-space:pre;overflow:auto}
  </style>
</head>
<body>
  <header>
    <h1>AI for Trades — Job Estimator</h1>
    <span class="badge">v106.12</span>
    <span id="statusDot" class="dot" title="Backend status"></span>
  </header>

  <main id="app">
    <!-- Left: inputs -->
    <section id="left-pane" class="pane">
      <h2>Job & Customer</h2>
      <form id="estimateForm" autocomplete="on">
        <!-- Trade + job meta -->
        <div class="row">
          <div>
            <label for="trade">Trade</label>
            <select id="trade" name="trade">
              <option value="" selected>Choose trade…</option>
              <option value="HVAC">HVAC</option>
              <option value="Electrical">Electrical</option>
              <option value="Plumbing">Plumbing</option>
              <option value="General">General</option>
            </select>
          </div>
          <div>
            <label for="urgency">Urgency</label>
            <select id="urgency" name="urgency">
              <option value="" selected>Normal</option>
              <option value="Rush">Rush</option>
              <option value="Emergency">Emergency</option>
              <option value="Low">Low</option>
            </select>
          </div>
        </div>

        <div class="row-3">
          <div>
            <label for="sqft">Approx. Sq Ft</label>
            <input id="sqft" name="sqft" type="number" min="0" inputmode="numeric" placeholder="e.g., 1200">
          </div>
          <div>
            <label for="rooms">Rooms / Zones</label>
            <input id="rooms" name="rooms" type="number" min="0" inputmode="numeric" placeholder="e.g., 6">
          </div>
          <div>
            <label for="difficulty">Difficulty</label>
            <select id="difficulty" name="difficulty">
              <option value="Standard" selected>Standard</option>
              <option value="Complex">Complex</option>
              <option value="Tight Space">Tight Space</option>
              <option value="Exterior">Exterior</option>
            </select>
          </div>
        </div>

        <!-- Customer -->
        <div class="row">
          <div>
            <label for="firstName">First Name</label>
            <input id="firstName" name="firstName" type="text" placeholder="First Name" />
          </div>
          <div>
            <label for="lastName">Last Name</label>
            <input id="lastName" name="lastName" type="text" placeholder="Last Name" />
          </div>
        </div>
        <div class="row">
          <div>
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" placeholder="(555) 555-5555" />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" />
          </div>
        </div>
        <div class="row">
          <div>
            <label for="address">Address</label>
            <input id="address" name="address" type="text" placeholder="123 Main St, City, ST" />
          </div>
          <div>
            <label for="zip">ZIP</label>
            <input id="zip" name="zip" type="text" inputmode="numeric" placeholder="12345" />
          </div>
        </div>

        <!-- Job description + materials/labor -->
        <label for="jobDescription">Job Description</label>
        <textarea id="jobDescription" name="jobDescription" placeholder="Describe the job... (existing equipment, access, constraints, desired outcome)"></textarea>

        <div class="row-3">
          <div>
            <label for="laborHours">Est. Labor Hours</label>
            <input id="laborHours" name="laborHours" type="number" min="0" step="0.5" placeholder="e.g., 6">
          </div>
          <div>
            <label for="laborRate">Labor Rate ($/hr)</label>
            <input id="laborRate" name="laborRate" type="number" min="0" step="1" placeholder="e.g., 95">
          </div>
          <div>
            <label for="materialsBudget">Materials Budget ($)</label>
            <input id="materialsBudget" name="materialsBudget" type="number" min="0" step="1" placeholder="e.g., 450">
          </div>
        </div>

        <div class="actions">
          <button id="estimateBtn" type="submit">Generate Estimate</button>
          <button id="pdfBtn" type="button" class="btn-secondary">Export PDF</button>
          <button type="reset" class="btn-secondary">Reset</button>
        </div>
      </form>

      <!-- Customer summary card -->
      <section id="customerCard" hidden aria-live="polite" aria-label="Customer summary">
        <div class="cust-row"><strong>Name:</strong> <span id="custName"></span></div>
        <div class="cust-row"><strong>Phone:</strong> <span id="custPhone"></span></div>
        <div class="cust-row"><strong>Email:</strong> <span id="custEmail"></span></div>
        <div class="cust-row"><strong>Address:</strong> <span id="custAddress"></span></div>
      </section>

      <!-- Inline error -->
      <div id="inlineError" hidden></div>
    </section>

    <!-- Right: results -->
    <section id="right-pane" class="pane">
      <div id="resultHeader">
        <div id="custNameHeader">Customer: —</div>
        <div>
          <small id="resultMeta" style="color:#8ea2b7"></small>
        </div>
      </div>
      <textarea id="estimateOutput" readonly placeholder="Estimate results will appear here..."></textarea>
    </section>
  </main>

  <footer>
    <p>AI for Trades Prototype — v106.12 • JS: <code>/app.js?v=106.12</code></p>
  </footer>

  <script src="/app.js?v=106.12"></script>
</body>
</html>
